spring:
  application:
    name: catalog

  datasource:
    url: jdbc:postgresql://172.19.221.131:5432/catalogdb
    username: cataloguser
    password: catalogpass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: 172.19.221.131
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: my-super-secret-key-that-is-at-least-32-characters-long
  expiration-ms: 86400000

server:
  port: 8080